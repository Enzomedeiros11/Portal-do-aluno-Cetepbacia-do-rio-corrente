<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background rounded squircle (matching navigation logo container) -->
  <rect width="64" height="64" rx="16" fill="url(#blueGrad)" />

  <!-- Inner Seal Circle -->
  <circle cx="32" cy="32" r="24" fill="#dc2626" filter="url(#shadow)" />
  <circle cx="32" cy="32" r="21" fill="#ffffff" />

  <!-- Colorful CETEP course bars -->
  <g transform="translate(18, 16)">
    <rect x="0" y="0" width="4" height="9" rx="2" fill="#2563eb" />
    <rect x="6" y="0" width="4" height="9" rx="2" fill="#dc2626" />
    <rect x="12" y="0" width="4" height="9" rx="2" fill="#eab308" />
    <rect x="18" y="0" width="4" height="9" rx="2" fill="#16a34a" />
    <rect x="24" y="0" width="4" height="9" rx="2" fill="#334155" />
  </g>

  <!-- CETEP Bold Title -->
  <text 
    x="32" 
    y="38" 
    text-anchor="middle" 
    fill="#0f172a" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="11" 
    font-weight="900" 
    letter-spacing="-0.5">CETEP</text>

  <!-- Subtitle -->
  <text 
    x="32" 
    y="44" 
    text-anchor="middle" 
    fill="#64748b" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
    font-size="4" 
    font-weight="700" 
    letter-spacing="0.3">BACIA DO RIO CORRENTE</text>
</svg>
